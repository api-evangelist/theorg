breaking_changes_observed:
- date: '2026-03-11'
  surface: 'GET /v1.2/companies/org-chart'
  change: >-
    Removed linkedinUrl and workEmail from node responses; removed the unplaced section;
    narrowed the section parameter to orgChart|board.
  mitigation: New URI version (v1.2) — v1.1 callers were not broken in place.
- date: '2026-08-13'
  surface: 'MCP tool get_org_chart'
  change: >-
    Return type changed from org-chart JSON to a signed iframe embed URL; the tool also
    became free.
  mitigation: >-
    NONE. The tool name was reused, the endpoint version did not change, and there is no
    tool-level version an agent can pin. Any agent parsing the previous payload broke
    silently on the release date. This is the clearest lifecycle risk on the provider's
    fastest-moving surface — the agent surface is where all 2026 H2 change is happening and
    it is the surface with no versioning at all.
