notes: >-
  api.theorg.com serves a real RFC 8414 authorization-server metadata document and a
  real RFC 9728 protected-resource metadata document. These are new since the 2026-07-21
  pass, and they are the discovery layer for OAuth 2.1 authorization of the MCP endpoint
  at https://api.theorg.com/v1.1/mcp. No security.txt, OIDC discovery, api-catalog,
  ai-plugin or A2A agent card is served on any host. developers.theorg.com and theorg.com
  answer every /.well-known/* path with an HTML 404 page (a genuine 404 status, not a
  soft-200 catch-all), so neither contributes a document.
