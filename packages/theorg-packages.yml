notes: >-
  The Org ships NO first-party client libraries in any language. This is an honest zero,
  verified against six registries and the full developer portal, not an unchecked gap.
  Integration is direct HTTPS + X-Api-Key, or the remote MCP endpoint. The non-code
  distribution surfaces the provider does offer are a Zapier connector
  (https://developers.theorg.com/zapier), an embeddable org-chart widget
  (https://developers.theorg.com/embed, captured in components/), and gzipped LDJSON
  monthly snapshots over SFTP (https://developers.theorg.com/flat-files).
