name: The Org
description: >-
  The Org operates the world's largest network of public organizational charts, mapping
  companies, their teams, and reporting hierarchies. Its developer platform exposes a
  metered REST API and an official MCP server for retrieving a company's public org chart
  by domain or LinkedIn URL, prospecting positions and people with rich filters, resolving
  a person's manager, and monitoring credit usage. Authentication is via an account-scoped
  X-Api-Key header over HTTPS, usage is metered in monthly credits, and the same key powers
  a remote Model Context Protocol endpoint exposing thirteen tools for agent-native access —
  company and person lookup, job search, reporting-line traversal, work-email resolution, and
  lead-list management. The MCP surface is materially wider than the REST API: eight of the
  thirteen tools have no REST equivalent, and list creation is the only write operation The
  Org exposes anywhere. Originally added to the API Evangelist network as a portfolio company
  of Balderton Capital.
